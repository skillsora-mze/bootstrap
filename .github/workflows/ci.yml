name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bash-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run Bash tests
        run: ./tests/run.sh
      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -print0 | xargs -0 shellcheck

  macos-static-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: find . -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
      - name: Validate Homebrew bundle syntax
        run: ruby -c packages/macos/Brewfile

  windows-static-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors) { $errors | Format-List; throw 'Windows PowerShell 5.1 parse errors detected.' }
      - name: Test native command handling with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows/test-native-command.ps1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Run Windows static tests
        shell: pwsh
        run: ./tests/windows/test-static.ps1
      - name: Test native command handling with PowerShell 7
        shell: pwsh
        run: ./tests/windows/test-native-command.ps1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { throw 'PSScriptAnalyzer reported errors.' }
