# Workstation Bootstrap configuration

bootstrap:
  version: "1.5.0"

modules:
  system_packages: true
  containers: true
  aws: true
  azure: true
  hashicorp: true
  kubernetes: true
  terminal: true

platform:
  macos:
    runtime: orbstack
  linux:
    distribution: debian
    runtime: docker-engine
  windows:
    minimum_build: 22631
    architecture: amd64
    runtime: wsl2-debian-docker
